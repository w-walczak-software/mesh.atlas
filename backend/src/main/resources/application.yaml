server:
  port: 8888
  ssl:
    key-store: "classpath:keystore.p12"
    key-store-password: atlas@paXs9o9
    key-store-type: PKCS12
    key-alias: atlas
  servlet:
    context-path: /atlas
  tomcat:
    threads:
      min-spare: 20
      max: 300

app:
  security:
    keycloak:
      client-id: mesh.atlas.web

spring:
  application:
    name: mesh.atlas
  main:
    web-application-type: servlet
    banner-mode: "off"
  ssl:
    bundle:
      pem:
        keycloak:
          truststore:
            certificate: classpath:certs/ca.crt
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.ww.local:8443/realms/atlas
          jwk-set-uri: https://keycloak.ww.local:8443/realms/atlas/protocol/openid-connect/certs

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://postgresql.ww.local:5432/atlas
    username: atlas
    password: atlas
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
    type: com.zaxxer.hikari.HikariDataSource
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: atlas

  flyway:
    baseline-on-migrate: true
    enabled: true
    default-schema: atlas
    create-schemas: true

logging:
  appender: default
  file:
    path: ./logs/
  level:
    pl.com.ww.mesh.atlas: debug
    org:
      springframework.security: DEBUG
      springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
      springframework.ws.client.MessageTracing.sent: TRACE
      springframework.ws.client.MessageTracing.received: TRACE
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: trace
        type:
          descriptor:
            sql:
              BasicBinder: trace