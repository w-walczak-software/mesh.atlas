<ng-container *transloco="let t; scope: 'dictionary'; lang: lang()">
  <div class="dict-page">
    <atlas-page-title [title]="t('dictionary.page.types.title')" [subtitle]="t('dictionary.page.types.subtitle')" />

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
    />
  </div>
</ng-container>
