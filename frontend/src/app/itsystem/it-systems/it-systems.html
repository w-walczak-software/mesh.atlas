<ng-container *transloco="let t; scope: 'itsystem'; lang: lang()">
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">{{ t('itsystem.title') }}</h1>
    </div>

    <mat-expansion-panel class="search-panel" [expanded]="true">
      <atlas-panel-header [title]="t('itsystem.search.title')" icon="search" />

      <form [formGroup]="searchForm" class="search-form" (ngSubmit)="onSearch()">
        <div class="search-row">
          <atlas-text-input class="search-field" controlName="query" [label]="t('itsystem.search.query')" icon="search" />

          <atlas-text-input class="search-field" controlName="ownerQuery" [label]="t('itsystem.search.ownerQuery')" icon="person_search" />

          <atlas-text-input class="search-field" controlName="tag" [label]="t('itsystem.search.tag')" icon="local_offer" />
        </div>

        <div class="search-row">
          <atlas-select-dictionary class="search-field" controlName="statusId"
            [label]="t('itsystem.field.status')" dictionaryCode="SYSTEM_STATUS" [nullOptionLabel]="t('itsystem.search.all')" />

          <atlas-select-dictionary class="search-field" controlName="lifecycleStageId"
            [label]="t('itsystem.field.lifecycleStage')" dictionaryCode="LIFECYCLE_STAGE" [nullOptionLabel]="t('itsystem.search.all')" />

          <atlas-select-dictionary class="search-field" controlName="businessCriticalityId"
            [label]="t('itsystem.field.businessCriticality')" dictionaryCode="BUSINESS_CRITICALITY" [nullOptionLabel]="t('itsystem.search.all')" />

          <atlas-select-dictionary class="search-field" controlName="systemTypeId"
            [label]="t('itsystem.field.systemType')" dictionaryCode="SYSTEM_TYPE" [nullOptionLabel]="t('itsystem.search.all')" />

          <atlas-select-active class="search-field search-field--narrow" controlName="active"
            [label]="t('itsystem.search.activeLabel')" />
        </div>

        <div class="search-actions">
          <button mat-stroked-button type="button" (click)="onReset()">
            <mat-icon>clear</mat-icon>
            {{ t('itsystem.search.reset') }}
          </button>
          <button mat-flat-button type="submit">
            <mat-icon>search</mat-icon>
            {{ t('itsystem.search.search') }}
          </button>
        </div>
      </form>
    </mat-expansion-panel>

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      [checkedRowIds]="restoredIds()"
      [selectedItem]="effectiveSelected()"
      (pageChange)="onPageChange($event)"
      (rowSelect)="selectedRow.set($event)"
      (rowsSelect)="onRowsSelect($event)"
    />
  </div>
</ng-container>
