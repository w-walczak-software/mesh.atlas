<ng-container *transloco="let t; scope: 'transportlayer'; lang: lang()">
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">{{ t('transportlayer.title') }}</h1>
    </div>

    <mat-expansion-panel class="search-panel" [expanded]="true">
      <atlas-panel-header [title]="t('transportlayer.search.title')" icon="search" />

      <form [formGroup]="searchForm" class="search-form" (ngSubmit)="onSearch()">
        <div class="search-row">
          <atlas-text-input class="search-field" controlName="query" [label]="t('transportlayer.search.query')" icon="search" />

          <atlas-select-active class="search-field search-field--narrow" controlName="active"
            [label]="t('transportlayer.search.activeLabel')" />
        </div>

        <div class="search-actions">
          <button mat-stroked-button type="button" (click)="onReset()">
            <mat-icon>clear</mat-icon>
            {{ t('transportlayer.search.reset') }}
          </button>
          <button mat-flat-button type="submit">
            <mat-icon>search</mat-icon>
            {{ t('transportlayer.search.search') }}
          </button>
        </div>
      </form>
    </mat-expansion-panel>

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
      (rowSelect)="selectedRow.set($event)"
    />
  </div>
</ng-container>
