<ng-container *transloco="let t; scope: 'datadomain'; lang: lang()">
  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">{{ t('datadomain.title') }}</h1>
    </div>

    <mat-expansion-panel class="search-panel" [expanded]="true">
      <atlas-panel-header [title]="t('datadomain.search.title')" icon="search" />

      <form [formGroup]="searchForm" class="search-form" (ngSubmit)="onSearch()">
        <div class="search-row">
          <atlas-text-input class="search-field" controlName="query" [label]="t('datadomain.search.query')" icon="search" />

          <atlas-text-input class="search-field" controlName="tag" [label]="t('datadomain.search.tag')" icon="local_offer" />

          <atlas-select-active class="search-field search-field--narrow" controlName="active"
            [label]="t('datadomain.search.activeLabel')" />

          <mat-form-field appearance="outline" class="search-field search-field--narrow">
            <mat-label>{{ t('datadomain.search.group') }}</mat-label>
            <mat-select formControlName="groupId">
              <mat-option [value]="null">{{ t('datadomain.search.all') }}</mat-option>
              @for (group of groups(); track group.id) {
                <mat-option [value]="group.id">{{ group.name }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>

        <div class="search-actions">
          <button mat-stroked-button type="button" (click)="onReset()">
            <mat-icon>clear</mat-icon>
            {{ t('datadomain.search.reset') }}
          </button>
          <button mat-flat-button type="submit">
            <mat-icon>search</mat-icon>
            {{ t('datadomain.search.search') }}
          </button>
        </div>
      </form>
    </mat-expansion-panel>

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
      (rowSelect)="selectedRow.set($event)"
      (rowsSelect)="onRowsSelect($event)"
    />
  </div>
</ng-container>
