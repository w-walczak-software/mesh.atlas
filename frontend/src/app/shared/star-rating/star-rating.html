<div
  class="star-rating"
  [class.star-rating--interactive]="interactive()"
  [class]="'star-rating--' + size()"
  (mouseleave)="onLeave()"
  role="group"
  [attr.aria-label]="value() !== null ? 'Rating: ' + value() + ' out of 5' : 'Not rated'"
>
  @for (star of stars; track star) {
    <button
      type="button"
      class="star-btn"
      [class.star-btn--filled]="(displayScore() ?? 0) >= star"
      [disabled]="!interactive()"
      [attr.aria-label]="'Rate ' + star + ' star' + (star > 1 ? 's' : '')"
      (mouseenter)="onHover(star)"
      (click)="onClick(star)"
    >
      <mat-icon class="star-icon" aria-hidden="true">{{ starIcon(star) }}</mat-icon>
    </button>
  }
</div>
