<mat-form-field appearance="outline" [subscriptSizing]="subscriptSizing()">
  <mat-label>{{ label() }}</mat-label>
  <textarea matInput
            [formControlName]="controlName()"
            [rows]="rows()"
            [placeholder]="placeholder()">
  </textarea>
  @for (msg of errorsToShow(); track msg) {
    <mat-error>{{ msg }}</mat-error>
  }
  <ng-content />
</mat-form-field>
