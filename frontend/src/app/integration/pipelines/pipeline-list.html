<ng-container *transloco="let t; scope: 'integration'; lang: lang()">
  <div class="integration-page">
    <atlas-page-title
      [title]="t('integration.page.pipelines.title')"
      [subtitle]="t('integration.page.pipelines.subtitle')"
    />
    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
      (rowSelect)="selected.set($event)"
    />
  </div>
</ng-container>
