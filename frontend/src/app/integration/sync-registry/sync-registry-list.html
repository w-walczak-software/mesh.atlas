<ng-container *transloco="let t; scope: 'integration'; lang: lang()">
  <div class="integration-page">
    <atlas-page-title
      [title]="t('integration.page.syncRegistry.title')"
      [subtitle]="t('integration.page.syncRegistry.subtitle')"
    />

    <mat-expansion-panel class="filter-panel" [expanded]="filtersExpanded()" (expandedChange)="filtersExpanded.set($event)">
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon>filter_list</mat-icon>
          {{ t('integration.filter.title') }}
        </mat-panel-title>
      </mat-expansion-panel-header>

        <form [formGroup]="filterForm" class="filter-form">
          <div class="filter-row">
            <mat-form-field appearance="outline">
              <mat-label>{{ t('integration.filter.pipelineCode') }}</mat-label>
              <input matInput formControlName="pipelineCode" />
              <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>{{ t('integration.registry.status') }}</mat-label>
              <mat-select formControlName="status">
                <mat-option [value]="null">{{ t('integration.filter.allStatuses') }}</mat-option>
                @for (s of syncStatuses; track s) {
                  <mat-option [value]="s">{{ t('integration.syncStatus.' + s.toLowerCase()) }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>

          <div class="filter-actions">
            <button mat-button type="button" (click)="resetFilters()">
              <mat-icon>clear</mat-icon>
              {{ t('integration.filter.reset') }}
            </button>
          </div>
        </form>
    </mat-expansion-panel>

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
    />
  </div>
</ng-container>
