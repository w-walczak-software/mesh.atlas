<ng-container *transloco="let t; scope: 'admin'; lang: lang()">
  <div class="admin-page system-parameters-page">

    <atlas-page-title [title]="t('admin.systemParam.page.title')" [subtitle]="t('admin.systemParam.page.subtitle')" />

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      [currentPage]="pageIndex()"
      (pageChange)="onPageChange($event)"
    />

  </div>
</ng-container>
