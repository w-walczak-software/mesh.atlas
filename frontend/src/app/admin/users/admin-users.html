<ng-container *transloco="let t; scope: 'admin'; lang: lang()">
  <div class="admin-page">
    <atlas-page-title [title]="t('admin.page.users.title')" [subtitle]="t('admin.page.users.subtitle')" />

    <div class="search-bar">
      <atlas-text-input class="search-field" [control]="searchControl" [label]="t('admin.user.search')"
                        icon="search" [ariaLabel]="t('admin.user.searchHint')" />
    </div>

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      [currentPage]="pageIndex()"
      (pageChange)="onPageChange($event)"
    />
  </div>
</ng-container>
