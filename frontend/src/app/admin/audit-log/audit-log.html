<ng-container *transloco="let t; scope: 'admin'; lang: lang()">
  <div class="admin-page audit-log-page">

    <atlas-page-title [title]="t('admin.page.auditLog.title')" [subtitle]="t('admin.page.auditLog.subtitle')" />

    <mat-accordion class="filter-panel">
      <mat-expansion-panel>
        <atlas-panel-header [title]="t('admin.auditLog.filter.title')" icon="filter_list" />

        <form [formGroup]="filterForm" class="filter-form" (ngSubmit)="applyFilters()">
          <div class="filter-row">
            <atlas-text-input controlName="actorUsername" [label]="t('admin.auditLog.filter.actor')" icon="person_search" />

            <atlas-select-audit-category controlName="category" [label]="t('admin.auditLog.filter.category')" />
            <atlas-select-audit-action controlName="action" [label]="t('admin.auditLog.filter.action')" />
            <atlas-select-audit-resource-type controlName="resourceType" [label]="t('admin.auditLog.filter.resourceType')" />
            <atlas-select-audit-outcome controlName="outcome" [label]="t('admin.auditLog.filter.outcome')" />
          </div>

          <div class="filter-row">
            <atlas-text-input controlName="startDate" [label]="t('admin.auditLog.filter.startDate')" type="datetime-local" icon="calendar_today" />

            <atlas-text-input controlName="endDate" [label]="t('admin.auditLog.filter.endDate')" type="datetime-local" icon="calendar_today" />
          </div>

          <div class="filter-actions">
            <button mat-button type="button" (click)="resetFilters()">
              <mat-icon>clear</mat-icon>
              {{ t('admin.auditLog.filter.reset') }}
            </button>
            <button mat-flat-button color="primary" type="submit">
              <mat-icon>search</mat-icon>
              {{ t('admin.auditLog.filter.search') }}
            </button>
          </div>
        </form>
      </mat-expansion-panel>
    </mat-accordion>

    <app-data-table
      [config]="tableConfig()"
      [data]="data()"
      [loading]="loading()"
      [currentPage]="pageIndex()"
      (pageChange)="onPageChange($event)"
    />

  </div>
</ng-container>
