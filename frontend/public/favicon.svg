<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e28"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Outer ring connections -->
  <g stroke="url(#accent)" stroke-opacity="0.35" stroke-width="0.9" fill="none">
    <line x1="16"   y1="7.2"  x2="23.6" y2="11.6"/>
    <line x1="23.6" y1="11.6" x2="23.6" y2="20.4"/>
    <line x1="23.6" y1="20.4" x2="16"   y2="24.8"/>
    <line x1="16"   y1="24.8" x2="8.4"  y2="20.4"/>
    <line x1="8.4"  y1="20.4" x2="8.4"  y2="11.6"/>
    <line x1="8.4"  y1="11.6" x2="16"   y2="7.2"/>
  </g>

  <!-- Spokes: center → ring nodes -->
  <g stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.1" fill="none">
    <line x1="16" y1="16" x2="16"   y2="7.2"/>
    <line x1="16" y1="16" x2="23.6" y2="11.6"/>
    <line x1="16" y1="16" x2="23.6" y2="20.4"/>
    <line x1="16" y1="16" x2="16"   y2="24.8"/>
    <line x1="16" y1="16" x2="8.4"  y2="20.4"/>
    <line x1="16" y1="16" x2="8.4"  y2="11.6"/>
  </g>

  <!-- Outer nodes -->
  <g fill="url(#accent)" opacity="0.88">
    <circle cx="16"   cy="7.2"  r="2.2"/>
    <circle cx="23.6" cy="11.6" r="2.2"/>
    <circle cx="23.6" cy="20.4" r="2.2"/>
    <circle cx="16"   cy="24.8" r="2.2"/>
    <circle cx="8.4"  cy="20.4" r="2.2"/>
    <circle cx="8.4"  cy="11.6" r="2.2"/>
  </g>

  <!-- Center node glow -->
  <circle cx="16" cy="16" r="5" fill="url(#accent)" opacity="0.15"/>
  <!-- Center node -->
  <circle cx="16" cy="16" r="3.2" fill="#e0e7ff"/>
</svg>
